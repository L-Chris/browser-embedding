[workspace]
members = ["crates/browser-embedding-core", "crates/browser-embedding-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
half = "2.7.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
tokenizers = { version = "0.23.1", default-features = false, features = ["unstable_wasm"] }
wasm-bindgen = "0.2.126"
